# Spotify <-> YouTube Music transfer, exposed online via a Cloudflare Tunnel.
#
# Quick start:
#   1. Copy .env.example to .env and fill in the required values
#      (Spotify/YT Music OAuth, APP_SECRET_KEY, PUBLIC_BASE_URL, TUNNEL_TOKEN).
#   2. In the Cloudflare Zero Trust dashboard create a Tunnel, copy the token
#      into TUNNEL_TOKEN, and add a public hostname routing
#      <your-domain> -> http://app:8000
#   3. docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spotifytoyoutube:latest
    container_name: spotifytoyoutube
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_STATIC_DIR: /app/web/frontend/dist
      SESSION_COOKIE_SECURE: "true"
      REPORTS_DIR: /data/reports
      SECRETS_DIR: /data/secrets
      # CORS / Spotify post-login redirect target. Set to your public URL.
      WEB_CORS_ORIGINS: ${PUBLIC_BASE_URL}
      # Spotify console must list this exact URI as a Redirect URI.
      SPOTIFY_REDIRECT_URI: ${PUBLIC_BASE_URL}/api/auth/spotify/callback
    volumes:
      - app_data:/data
    expose:
      - "8000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: spotifytoyoutube-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  app_data:
